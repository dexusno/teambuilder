# TeamBuilder Module Configuration
# Generated by BMAD installer; this file is overlaid with user-provided values
# at install time. Path variables like {project-root} are resolved at runtime
# by the bmad-init skill.

# Module metadata
module: teambuilder
version: 3.0.0

# Inherited from core (populated by installer)
user_name: ""
communication_language: English
document_output_language: English
output_folder: _bmad-output

# TeamBuilder-specific paths
teams_directory: "{project-root}/_bmad-output/teams"
patterns_directory: "{project-root}/_bmad/teambuilder/patterns"
templates_directory: "{project-root}/_bmad/teambuilder/templates"
general_knowledge: "{project-root}/_bmad/teambuilder/memory/general-knowledge.jsonl"
team_memory_filename: memory.jsonl
session_context_filename: session-context.md

# Quality thresholds for validation scoring
quality_thresholds:
  excellent: 95
  good: 85
  acceptable: 75
  minimum: 60

# Generation settings
generation:
  default_team_size: "6-8"
  min_agents: 4
  max_agents: 12
  use_pattern_matching: true
  max_patterns_loaded: 3
  require_coordinator: true
  require_domain_expert: true
  persona_distinctness_threshold: 0.6
  generate_workflows: true
  min_workflow_steps: 3
  max_workflow_steps: 10

# Validation settings
validation:
  run_agent_checks: true
  run_workflow_checks: true
  run_team_checks: true
  agent_check_weight: 0.4
  workflow_check_weight: 0.3
  team_check_weight: 0.3
  auto_suggest_refinements: true
  max_refinement_iterations: 3

# Discovery settings
discovery:
  supported_domains:
    - research-intelligence
    - planning-strategy
    - creative-content
    - technical-development
    - operations-support
    - domain-specific-expert
  min_questions: 5
  max_questions: 10
  enable_domain_branching: true
  generate_requirements_doc: true

# Pattern library
patterns:
  pattern_list:
    - { name: itil-domain-expert,    type: domain-specialist, characteristics: [large, formal, governance] }
    - { name: software-development,  type: development,       characteristics: [agile, sprint-based, technical] }
    - { name: research-intelligence, type: research,          characteristics: [iterative, synthesis, verification] }
    - { name: planning-strategy,     type: planning,          characteristics: [consultative, multi-perspective, risk-aware] }
    - { name: creative-content,      type: creative,          characteristics: [creative-process, brand-aware, optimization] }
    - { name: operations-process,    type: operations,        characteristics: [lean, six-sigma, continuous-improvement] }
  load_full_patterns: false
  cache_patterns: true

# Refinement
refinement:
  targeted_refinement: true
  preserve_good_agents: true
  max_iterations: 3
  supported_refinements:
    - improve_personas
    - add_missing_expertise
    - enhance_workflows
    - adjust_team_size
    - change_collaboration_model

# User preferences
user_preferences:
  default_collaboration_style: balanced
  default_workflow_style: guided
  verbose_output: true
  include_examples: true
  show_validation_details: true
  auto_install_high_quality: false
  prompt_before_refinement: true

# Feature flags
feature_flags:
  enable_pattern_learning: true
  enable_validation: true
  enable_refinement: true
  enable_domain_branching: true
